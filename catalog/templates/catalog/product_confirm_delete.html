{% extends 'catalog/base.html' %}

{% block title %} - Удаление товара{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Удалить товар?</h1>
    <p>Вы уверены, что хотите удалить <strong>"{{ object.name }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
