{% extends 'catalog/base.html' %}

{% block title %} - Снятие с публикации{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>🚫 Снять с публикации?</h1>

    <div class="card">
        <div class="card-body">
            <p>Вы уверены, что хотите снять с публикации товар:</p>
            <h4>"{{ object.name }}"</h4>
            <p class="text-muted">Цена: ${{ object.price }}</p>
        </div>
    </div>

    <form method="post" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-warning">🚫 Да, снять с публикации</button>
        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
