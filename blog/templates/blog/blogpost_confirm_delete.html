{% extends 'catalog/base.html' %}

{% block title %} - Удаление статьи{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Удалить статью?</h1>
    <p>Вы уверены, что хотите удалить <strong>"{{ object.title }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
        <a href="{% url 'blog:post_list' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
